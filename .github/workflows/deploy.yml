name: Deploy to Cloudflare Pages

# Continuous deployment: every push to main builds the static site and ships
# it to Cloudflare Pages. Requires two repo secrets
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - cloudflare dashboard → My Profile → API Tokens
#                            (template: "Cloudflare Pages — Edit")
#   CLOUDFLARE_ACCOUNT_ID  - dashboard URL or Workers & Pages → Account details
# No credit card required. `wrangler pages deploy` creates the project on first run.
#
# Simpler alternative (zero secrets, no Actions): connect this repo in the
# Cloudflare dashboard → Workers & Pages → Create → Pages → Connect to Git,
# build command `bun run build`, output dir `out`. Then delete this file.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Create Pages project (first run) & deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # idempotent: create the project the first time, ignore "already exists" after
          bunx wrangler@4 pages project create zack-portfolio --production-branch=main || echo "project already exists — continuing"
          bunx wrangler@4 pages deploy out --project-name=zack-portfolio --branch=main
